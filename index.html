<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Training course catalog that loads sample course, lesson and instructor data from JSON files.">
    <meta name="author" content="Touseef Ahmed">
    <title>Training Course Catalog | Bloomrix</title>
</head>

<body>
    <header class="site-header">
        <h1>Training Course Catalog</h1>
        <p>Search, filter and sort the training courses. The data is loaded from JSON files when the page opens.</p>
        <p><small>All course, lesson and instructor data on this page is sample data.</small></p>
    </header>

    <main>
        <section class="section" id="summary" hidden>
            <h2>Catalog Summary</h2>

            <div class="stat-grid" id="stat-grid"></div>

            <h3>Courses by category</h3>
            <ul class="tag-list" id="category-list"></ul>

            <p class="notice" id="data-notice" hidden></p>
        </section>
    </main>
</body>

</html>
